# The `conductor` agent preset: the conductor-mode window (指挥家模式).
#
# A session composed from this preset is the CONDUCTOR window of a
# conductor-led task team. The user describes a task objective; the conductor
# analyzes it, decomposes it into subtasks with dependencies, writes the
# implementation plan outline, tracks progress on the event-sourced task
# board, and schedules worker windows through the automatic round driver
# (`dsh-conductor-round-driver`, host-plane). Worker windows are continuable
# subagent children created by the conductor service; they join THIS
# composition (so they inherit these tools), while the service restricts the
# conductor-only tools away from them and installs the worker persona.
#
# The board service (`ctx.conductor`) and the driver live in the HOST
# composition (`base.cordis.yml`), exactly like the goal domain and its
# driver; this file contributes only model-facing rows. A service row here
# MUST sit inside a group carrying an `isolate` realm — without one it
# publishes into the root realm, where it is process-global, and
# `dsh-agent-presets` rejects that at mount.
#
# Compared to `standard`: plan mode is omitted (the implementation plan
# outline lives in the board), the goal and todo tools are omitted (the task
# board is the tracker), and the conductor tools plus the worker report tool
# are added.

# ── identity ────────────────────────────────────────────────────────────────

# The conductor persona. Worker windows shadow this with the service-provided
# worker persona; the tool guidance sections render only where the conductor
# tools are visible, so workers never see the conductor protocol.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是任务团队的指挥家（Conductor）。用户向你描述一个任务目标后，你的职责是：分析目标、把
      目标拆解为带依赖关系的子任务、编写实现方案大纲、在任务板上追踪进度、协调各任务窗口按节奏
      推进，并把进度与卡点统一汇报给用户。你只负责整体统筹；具体实现由你拆分的子任务窗口完成。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition; both shell tools consume the host
# registry from here, exactly as in `standard`.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls; the task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── conductor orchestration ─────────────────────────────────────────────────

# The conductor's own tools (board init, task decomposition, status tracking,
# scheduling, worker messaging, handover), the worker's report tool, and the
# user-question tool for blockers that need the user's decision. All of them
# register into THIS preset's layer of the host registries and publish
# nothing, so they need no realm. Worker windows inherit the same rows; the
# conductor service restricts the conductor-only tools away from them at
# child creation, and task_report's service-side authority admits only the
# task's assigned worker.
- id: tool-conductor
  name: '@deepseek-ai/dsh-tool-conductor'
  config:
    workerHandoverAfterCompactions: 4

- id: tool-task-report
  name: '@deepseek-ai/dsh-tool-task-report'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── compaction ──────────────────────────────────────────────────────────────

# The conductor window MUST compact like any long session: the round driver
# reads the session's compaction count and hands the role to a fresh window
# when the threshold is crossed, which is how output quality survives a very
# long orchestration. Same realm arrangement as `standard`.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition; this preset contributes the delegation TOOLS. The conductor
# service spawns workers directly through the host registry, so these rows
# are for the conductor's own ad-hoc delegation. `tool-subagent-report` is
# host-plane for the same reason as in `standard`.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

# ── remaining model-facing rows ─────────────────────────────────────────────

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
